---

- name: Install pip
  become: true
  ansible.builtin.dnf:
    name: python3-pip
    state: present

- name: Install s3cmd
  become: true
  ansible.builtin.shell: pip3 install s3cmd

- name: Copy CA certificate
  become: true
  ansible.builtin.copy:
    content: "{{ openbao_backup_s3_ca_certs_content }}"
    dest: "{{ openbao_backup_s3_ca_certs_file }}"
    mode: "0644"
    owner: "{{ openbao_backup_user }}"
    group: "{{ openbao_backup_group }}"

- name: Configure s3cmd
  become: true
  ansible.builtin.template:
    src: "templates/.s3cfg.j2"
    dest: "{{ openbao_backup_s3_config_path }}/.s3cfg"
    owner: "{{ openbao_backup_user }}"
    group: "{{ openbao_backup_group }}"
    mode: "0600"

- name: Copy OpenBao snapshot script
  become: true
  ansible.builtin.template:
    src: "{{ openbao_backup_snapshot_script_template }}"
    dest: "{{ openbao_backup_snapshot_script_path }}"
    owner: "{{ openbao_backup_user }}"
    group: "{{ openbao_backup_group }}"
    mode: "0700"
