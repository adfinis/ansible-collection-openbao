---
# tasks file for OpenBao repository installation
# ------------------------------------------------------------------------
# OpenBao RedHat repository configuration

- name: Configure and enable OpenBao RedHat repository
  become: true
  ansible.builtin.yum_repository:
    name: "{{ openbao_install_redhat_repository_name }}"
    description: "{{ openbao_install_redhat_repository_description }}"
    enabled: "{{ openbao_install_redhat_repository_enabled }}"
    baseurl: "{{ openbao_install_redhat_repository_url }}"
    gpgcheck: "{{ openbao_install_redhat_repository_gpgcheck }}"
    gpgkey: "{{ openbao_install_redhat_repository_gpgkey }}"
    repo_gpgcheck: "{{ openbao_install_redhat_repository_repo_gpgcheck }}"
    sslcacert: "{{ openbao_install_redhat_repository_sslcacert }}"
    sslverify: "{{ openbao_install_redhat_repository_sslverify }}"
    metadata_expire: "{{ openbao_install_redhat_repository_metadata_expire }}"

- name: Install OpenBao from repository
  become: true
  ansible.builtin.package:
    name: "{{ openbao_install_redhat_repository_package_name }}"
    state: present
    update_cache: true
    allow_downgrade: true
