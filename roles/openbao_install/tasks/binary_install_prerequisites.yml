---
# tasks file for OpenBao installation from binary tarball prerequisites
# ------------------------------------------------------------------------
# Installs the required packages for GPG key verification and tarball
# extraction

- name: >-
    Make sure required package "gpg" is installed if
    openbao_install_binary_package_gpg_key_verification is set
  when:
    - openbao_install_binary_package_gpg_key_verification
  become: true
  ansible.builtin.package:
    name: "{{ openbao_install_binary_package_gpg_package_name }}"
    state: present
    update_cache: true

- name: Make sure required package "tar" is installed
  become: true
  ansible.builtin.package:
    name: "tar"
    state: present
    update_cache: true

- name: Check if OpenBao binary directory exists
  ansible.builtin.stat:
    path: "{{ openbao_install_binary_config_path }}"
  register: openbao_install_binary_config_path_dir_stat

- name: Create OpenBao configuration directory
  when: not openbao_install_binary_config_path_dir_stat.stat.exists
  become: true
  ansible.builtin.file:
    path: "{{ openbao_install_binary_config_path }}"
    state: directory
    owner: "{{ openbao_install_user_name }}"
    group: "{{ openbao_install_user_group_name }}"
    mode: "0750"
