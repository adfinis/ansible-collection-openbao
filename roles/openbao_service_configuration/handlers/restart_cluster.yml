---
# handlers file for OpenBao safe cluster restart
# ------------------------------------------------------------------------
# Checks node health and leader state, restarts followers and leader in
# the correct order, and waits for the cluster to recover before
# continuing.


- name: Restart followers
  when: openbao_service_configuration_task_result_initialized.status == 429
  become: true
  ansible.builtin.systemd:
    name: "{{ openbao_service_configuration_systemd_unit_name }}"
    state: restarted
    enabled: "{{ not openbao_service_configuration_systemd_unit_disabled }}"
    daemon_reload: true
  listen: restart_cluster

- name: Wait for followers to come back up
  when: openbao_service_configuration_task_result_initialized.status == 200
  ansible.builtin.uri:
    url: >-
      https://{{ item ~ ':' ~ openbao_service_configuration_api_port }}/v1/sys/health
    validate_certs: false
    method: GET
    # 200 if initialized, unsealed, and active
    # 429 if unsealed and standby
    # 501 if not initialized
    # 503 if sealed
    status_code:
      - 200
      - 429
  register: openbao_service_configuration_task_result_followers
  retries: 6
  until:
    - >
      (
        'openbao' in ansible_facts.packages
        and openbao_service_configuration_task_result_followers.json.version
        == ansible_facts.packages['openbao'].version
      )
      or
      (
        openbao_service_configuration_installed_version is defined
        and openbao_service_configuration_task_result_followers.json.version
        == openbao_service_configuration_installed_version
      )
  delay: 10
  changed_when: false
  loop: "{{ ansible_play_hosts_all | reject('equalto', inventory_hostname) }}"
  listen: restart_cluster
  ignore_errors: true

- name: >-
    {{ 'Restart active node (leader)'
    if openbao_service_configuration_task_result_initialized.status == 200
    else
      '(Re-)Start and enable OpenBao service on uninitialized or sealed nodes'
    }}
  when: >-
    ( openbao_service_configuration_task_result_initialized.status == 200 )
    or
    ( openbao_service_configuration_task_result_initialized.status == 501 )
    or
    ( openbao_service_configuration_task_result_initialized.status == 503 )
  become: true
  ansible.builtin.systemd:
    name: "{{ openbao_service_configuration_systemd_unit_name }}"
    state: restarted
    enabled: "{{ not openbao_service_configuration_systemd_unit_disabled }}"
    daemon_reload: true
  listen: restart_cluster
