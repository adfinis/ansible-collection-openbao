---
# argument spec file for adfinis.openbao.openbao

argument_specs:
  main:
    short_description: Installs and configures OpenBao as a cluster-ready service.
    description:
      - Manages OpenBao installation and configuration through package repositories or binary distribution.
      - Supports TLS, Raft storage, and auto-unseal through various seal backends.
    options:
      openbao_service_configuration_openbao_binary_path:
        type: str
        description: Path to the OpenBao binary executable.
        default: "/usr/local/bin/bao"

      # User Configuration
      openbao_service_configuration_user_name:
        type: str
        description: Local OpenBao system user name.
        default: "openbao"

      openbao_service_configuration_user_group_name:
        type: str
        description: Local OpenBao system group name.
        default: "{{ openbao_service_configuration_user_name }}"

      # Configuration Paths
      openbao_service_configuration_base_path:
        type: str
        description: Root directory for runtime and configuration files.
        default: "/etc/openbao"

      openbao_service_configuration_data_path:
        type: str
        description: Base path for cluster data and systemd configuration.
        default: "/opt/openbao"

      openbao_service_configuration_runtime_path:
        type: str
        description: Directory containing the OpenBao executable.
        default: "{{ openbao_service_configuration_base_path }}/bin"

      openbao_service_configuration_config_path:
        type: str
        description: Directory for service configuration and environment files.
        default: "{{ openbao_service_configuration_base_path }}"

      openbao_service_configuration_config_template_content:
        type: str
        description: File content loaded from the HCL template path.
        default: "{{ lookup('file', openbao_service_configuration_config_template_file_path) }}"

      openbao_service_configuration_config_file_name:
        type: str
        description: Name of the main HCL configuration file.
        default: "openbao.hcl"

      openbao_service_configuration_config_template_file_path:
        type: str
        description: Path to the HCL config template file.
        default: "openbao.hcl.j2"

      openbao_service_configuration_environment_template_content:
        type: str
        description: File content loaded from the environment template path.
        default: "{{ lookup('file', openbao_service_configuration_environment_template_file_path) }}"

      openbao_service_configuration_environment_file_name:
        type: str
        description: Name of the environment file rendered by the role.
        default: "openbao.env"

      openbao_service_configuration_environment_template_file_path:
        type: str
        description: Path to the environment template file.
        default: "openbao.env.j2"

      # TLS Configuration
      openbao_service_configuration_tls_path:
        type: str
        description: Directory for TLS certificates and keys.
        default: "{{ openbao_service_configuration_data_path }}/tls"

      openbao_service_configuration_tls_cert_content:
        type: str
        description: PEM content for the server certificate rendered to disk.
        default: >-
          {{ lookup('file', openbao_service_configuration_tls_cert_file_src)
          if openbao_service_configuration_tls_cert_file_src | length > 0
          else lookup('ansible.builtin.env', 'TLS_SERVER_CERT')
          }}

      openbao_service_configuration_tls_cert_file:
        type: str
        description: Server certificate file path.
        default: >-
          {{ openbao_service_configuration_tls_path ~ '/' ~
          openbao_service_configuration_tls_cert_file_src | basename
          if openbao_service_configuration_tls_cert_file_src | length > 0
          else openbao_service_configuration_tls_path ~ '/server.crt'
          }}

      openbao_service_configuration_tls_cert_file_src:
        type: str
        description: Optional local source file for the server certificate.
        default: ""

      openbao_service_configuration_tls_key_content:
        type: str
        description: PEM content for the server private key rendered to disk.
        default: >-
          {{ lookup('file', openbao_service_configuration_tls_key_file_src)
          if openbao_service_configuration_tls_key_file_src | length > 0
          else lookup('ansible.builtin.env', 'TLS_SERVER_KEY')
          }}

      openbao_service_configuration_tls_key_file:
        type: str
        description: Server private key file path.
        default: >-
          {{ openbao_service_configuration_tls_path ~ '/' ~
          openbao_service_configuration_tls_key_file_src | basename
          if openbao_service_configuration_tls_key_file_src | length > 0
          else openbao_service_configuration_tls_path ~ '/server.key'
          }}

      openbao_service_configuration_tls_key_file_src:
        type: str
        description: Optional local source file for the server private key.
        default: ""

      openbao_service_configuration_tls_client_ca_content:
        type: str
        description: PEM content for the client CA bundle rendered to disk.
        default: >-
          {{ lookup('file', openbao_service_configuration_tls_client_ca_file_src)
          if openbao_service_configuration_tls_client_ca_file_src | length > 0
          else lookup('ansible.builtin.env', 'TLS_CLIENT_CA_CERT')
          }}

      openbao_service_configuration_tls_client_ca_file:
        type: str
        description: Client CA certificate file path.
        default: >-
          {{ openbao_service_configuration_tls_path ~ '/' ~
          openbao_service_configuration_tls_client_ca_file_src | basename
          if openbao_service_configuration_tls_client_ca_file_src | length > 0
          else openbao_service_configuration_tls_path ~ '/ca.crt'
          }}

      openbao_service_configuration_tls_client_ca_file_src:
        type: str
        description: Optional local source file for the client CA certificate.
        default: ""

      # Data Storage Paths
      openbao_service_configuration_data_storage_raft_path:
        type: str
        description: Raft storage data directory.
        default: "{{ openbao_service_configuration_data_path }}/data"

      openbao_service_configuration_data_audit_path:
        type: str
        description: Audit log directory.
        default: "{{ openbao_service_configuration_data_path }}/audit"

      openbao_service_configuration_data_log_path:
        type: str
        description: Log directory for OpenBao logs.
        default: "{{ openbao_service_configuration_data_path }}/log"

      # Systemd Configuration
      openbao_service_configuration_systemd_unit_disabled:
        type: bool
        description: Disable the OpenBao service.
        default: false

      openbao_service_configuration_systemd_unit_name:
        type: str
        description: Name of the systemd service unit file.
        default: "openbao.service"

      # API and Cluster Configuration
      openbao_service_configuration_api_port:
        type: int
        description: OpenBao API listener port.
        default: 8200

      openbao_service_configuration_api_addr:
        type: str
        description: External URL advertised for the API endpoint.
        default: "https://{{ inventory_hostname ~ ':' ~ openbao_service_configuration_api_port }}"

      openbao_service_configuration_cluster_port:
        type: int
        description: OpenBao cluster listener port.
        default: 8201

      openbao_service_configuration_cluster_addr:
        type: str
        description: URL advertised for clustering with other nodes.
        default: "https://{{ inventory_hostname ~ ':' ~ openbao_service_configuration_cluster_port }}"

      # Seal Configuration Backends
      openbao_service_configuration_seal_static:
        type: dict
        description: Static seal backend configuration (for testing only).
        options:
          current_key_id:
            type: str
            description: Key identifier for static seal.
          current_key:
            type: str
            description: Encryption key for static seal.
        default: {}

      openbao_service_configuration_seal_awskms:
        type: dict
        description: AWS KMS seal backend configuration.
        options:
          region:
            type: str
            description: AWS region.
          access_key:
            type: str
            description: AWS access key.
          secret_key:
            type: str
            description: AWS secret key.
          session_token:
            type: str
            description: AWS session token.
          kms_key_id:
            type: str
            description: AWS KMS key ID or ARN.
          endpoint:
            type: str
            description: Custom KMS endpoint URL.
          iam_endpoint:
            type: str
            description: Custom IAM endpoint URL.
          sts_endpoint:
            type: str
            description: Custom STS endpoint URL.
          role:
            type: str
            description: AWS IAM role to assume.
          disable_renewal:
            type: bool
            description: Disable credential renewal.
          lease_path:
            type: str
            description: Path for lease storage.
        default: {}

      openbao_service_configuration_seal_azurekeyvault:
        type: dict
        description: Azure Key Vault seal backend configuration.
        options:
          tenant_id:
            type: str
            description: Azure tenant ID.
          client_id:
            type: str
            description: Azure client ID.
          client_secret:
            type: str
            description: Azure client secret.
          key_name:
            type: str
            description: Key name in Key Vault.
          key_vault_name:
            type: str
            description: Key Vault name.
          environment:
            type: str
            description: Azure environment (e.g., AzurePublicCloud).
          vault_addr:
            type: str
            description: Custom vault address.
          disable_renewal:
            type: bool
            description: Disable credential renewal.
          lease_path:
            type: str
            description: Path for lease storage.
        default: {}

      openbao_service_configuration_seal_gcpckms:
        type: dict
        description: Google Cloud KMS seal backend configuration.
        options:
          project:
            type: str
            description: GCP project ID.
          region:
            type: str
            description: GCP region.
          key_ring:
            type: str
            description: GCP KMS key ring name.
          crypto_key:
            type: str
            description: GCP KMS crypto key name.
          credentials:
            type: str
            description: GCP service account credentials JSON.
          disable_renewal:
            type: bool
            description: Disable credential renewal.
          lease_path:
            type: str
            description: Path for lease storage.
        default: {}

      openbao_service_configuration_seal_transit:
        type: dict
        description: Transit seal backend configuration.
        options:
          address:
            type: str
            description: Address of the transit server.
          token:
            type: str
            description: Authentication token.
          disable_renewal:
            type: bool
            description: Disable credential renewal.
          mount_path:
            type: str
            description: Mount path for transit backend.
          namespace:
            type: str
            description: Namespace for transit backend.
          tls_skip_verify:
            type: bool
            description: Skip TLS verification.
          lease_path:
            type: str
            description: Path for lease storage.
        default: {}

      openbao_service_configuration_seal_pkcs11:
        type: dict
        description: PKCS11 seal backend configuration.
        options:
          lib:
            type: str
            description: Path to PKCS11 library.
          slot:
            type: str
            description: PKCS11 slot number.
          pin:
            type: str
            description: PIN for PKCS11 token.
          token_label:
            type: str
            description: PKCS11 token label.
          key_label:
            type: str
            description: PKCS11 key label.
          key_id:
            type: str
            description: PKCS11 key ID.
          mechanism:
            type: str
            description: PKCS11 mechanism.
          disable_renewal:
            type: bool
            description: Disable credential renewal.
          lease_path:
            type: str
            description: Path for lease storage.
        default: {}

      openbao_service_configuration_seal_ocikms:
        type: dict
        description: Oracle Cloud KMS seal backend configuration.
        options:
          compartment_id:
            type: str
            description: OCI compartment ID.
          key_id:
            type: str
            description: OCI key ID.
          crypto_endpoint:
            type: str
            description: OCI crypto endpoint.
          management_endpoint:
            type: str
            description: OCI management endpoint.
          auth_type:
            type: str
            description: Authentication type.
          disable_renewal:
            type: bool
            description: Disable credential renewal.
          lease_path:
            type: str
            description: Path for lease storage.
        default: {}

      openbao_service_configuration_seal_alicloudkms:
        type: dict
        description: Alibaba Cloud KMS seal backend configuration.
        options:
          region:
            type: str
            description: Alibaba Cloud region.
          access_key:
            type: str
            description: Alibaba Cloud access key.
          secret_key:
            type: str
            description: Alibaba Cloud secret key.
          kms_key_id:
            type: str
            description: Alibaba Cloud KMS key ID.
          endpoint:
            type: str
            description: Custom KMS endpoint.
          role_arn:
            type: str
            description: Role ARN for authentication.
          disable_renewal:
            type: bool
            description: Disable credential renewal.
          lease_path:
            type: str
            description: Path for lease storage.
        default: {}

      openbao_service_configuration_seal_aead:
        type: dict
        description: AEAD seal backend configuration.
        options:
          type:
            type: str
            description: AEAD cipher type.
          key_name:
            type: str
            description: Key name.
          key_id:
            type: str
            description: Key ID.
          namespace:
            type: str
            description: Namespace.
          disabled:
            type: bool
            description: Disable the seal.
          lease_path:
            type: str
            description: Path for lease storage.
        default: {}
