---
# defaults file for openbao

openbao_service_configuration_openbao_binary_path: "/usr/local/bin/bao"

openbao_service_configuration_user_name: "openbao"
openbao_service_configuration_user_group_name: "{{ openbao_service_configuration_user_name }}"

openbao_service_configuration_systemd_unit_disabled: false
openbao_service_configuration_systemd_unit_name: "openbao.service"

openbao_service_configuration_base_path: "/etc/openbao"
openbao_service_configuration_data_path: "/opt/openbao"
openbao_service_configuration_runtime_path: "{{ openbao_service_configuration_base_path }}/bin"
openbao_service_configuration_config_path: "{{ openbao_service_configuration_base_path }}"
openbao_service_configuration_config_template_content: >-
  {{ lookup('file', openbao_service_configuration_config_template_file_path) }}
openbao_service_configuration_config_file_name: "openbao.hcl"
openbao_service_configuration_config_template_file_path: "templates/openbao.hcl.j2"
openbao_service_configuration_environment_template_content: >-
  {{ lookup('file', openbao_service_configuration_environment_template_file_path) }}
openbao_service_configuration_environment_file_name: "openbao.env"
openbao_service_configuration_environment_template_file_path: "templates/openbao.env.j2"
openbao_service_configuration_tls_path: "{{ openbao_service_configuration_data_path }}/tls"
openbao_service_configuration_tls_cert_content: >-
  {{ lookup('file', openbao_service_configuration_tls_cert_file_src)
  if openbao_service_configuration_tls_cert_file_src | length > 0
  else lookup('ansible.builtin.env', 'TLS_SERVER_CERT')
  }}
openbao_service_configuration_tls_cert_file: >-
  {{ openbao_service_configuration_tls_path ~ '/' ~
  openbao_service_configuration_tls_cert_file_src | basename
  if openbao_service_configuration_tls_cert_file_src | length > 0
  else openbao_service_configuration_tls_path ~ '/server.crt'
  }}
openbao_service_configuration_tls_cert_file_src: ''
openbao_service_configuration_tls_key_content: >-
  {{ lookup('file', openbao_service_configuration_tls_key_file_src)
  if openbao_service_configuration_tls_key_file_src | length > 0
  else lookup('ansible.builtin.env', 'TLS_SERVER_KEY')
  }}
openbao_service_configuration_tls_key_file: >-
  {{ openbao_service_configuration_tls_path ~ '/' ~
  openbao_service_configuration_tls_key_file_src | basename
  if openbao_service_configuration_tls_key_file_src | length > 0
  else openbao_service_configuration_tls_path ~ '/server.key'
  }}
openbao_service_configuration_tls_key_file_src: ''
openbao_service_configuration_tls_client_ca_content: >-
  {{ lookup('file', openbao_service_configuration_tls_client_ca_file_src)
  if openbao_service_configuration_tls_client_ca_file_src | length > 0
  else lookup('ansible.builtin.env', 'TLS_CLIENT_CA_CERT')
  }}
openbao_service_configuration_tls_client_ca_file: >-
  {{ openbao_service_configuration_tls_path ~ '/' ~
  openbao_service_configuration_tls_client_ca_file_src | basename
  if openbao_service_configuration_tls_client_ca_file_src | length > 0
  else openbao_service_configuration_tls_path ~ '/ca.crt'
  }}
openbao_service_configuration_tls_client_ca_file_src: ''
openbao_service_configuration_data_storage_raft_path: >-
  {{ openbao_service_configuration_data_path }}/data
openbao_service_configuration_data_audit_path: >-
  {{ openbao_service_configuration_data_path }}/audit
openbao_service_configuration_data_systemd_path: >-
  {{ openbao_service_configuration_data_path }}/systemd
openbao_service_configuration_data_systemd_unit_name: "openbao.service"
openbao_service_configuration_data_systemd_template_file_path: "openbao.service.j2"
openbao_service_configuration_data_log_path: >-
  {{ openbao_service_configuration_data_path }}/log
openbao_service_configuration_api_port: 8200
openbao_service_configuration_api_addr: >-
  https://{{ inventory_hostname ~ ':' ~ openbao_service_configuration_api_port }}
openbao_service_configuration_cluster_port: 8201
openbao_service_configuration_cluster_addr: >-
  https://{{ inventory_hostname ~ ':' ~ openbao_service_configuration_cluster_port }}

